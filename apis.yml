aid: employment-hero
name: Employment Hero
description: >-
  Employment Hero is an AI-powered Employment Operating System for Australian
  and international businesses combining HR, payroll, recruitment, onboarding,
  learning, and employee benefits into a single platform. The product covers
  policy management, automated workflows, AI-assisted hiring, an employee
  mobile app, and the HeroForce managed employment service. The Employment
  Hero API is a versioned REST API authenticated via OAuth 2.0 with short-
  lived (15-minute) access tokens and refresh tokens.
type: Index
