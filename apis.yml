apis:
- aid: employment-hero:rest-api
  name: Employment Hero REST API
  description: >-
    Versioned REST API (v1) for accessing Employment Hero HR, payroll, and employee data including organisations,
    employees, teams, leave, pay runs, and onboarding. Apps register through the Developer Portal to obtain
    OAuth 2.0 client credentials; access tokens are sent via the Authorization header and expire after
    15 minutes, refreshed via refresh tokens.
  humanURL: https://developer.employmenthero.com/api-references
  baseURL: https://api.employmenthero.com/api/v1
