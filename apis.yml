aid: employment-hero
name: Employment Hero
description: >-
  Employment Hero is an AI-powered Employment Operating System for Australian
  and international businesses combining HR, payroll, recruitment, onboarding,
  learning, and employee benefits into a single platform. The product covers
  policy management, automated workflows, AI-assisted hiring, an employee
  mobile app, and the HeroForce managed employment service. The Employment
  Hero API is a versioned REST API authenticated via OAuth 2.0 with short-
  lived (15-minute) access tokens and refresh tokens.
type: Index
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
  - HR
  - HRIS
  - Payroll
  - Recruitment
  - Employee Benefits
  - Workforce Management
  - HR Tech
url: >-
  https://raw.githubusercontent.com/api-evangelist/employment-hero/refs/heads/main/apis.yml
created: '2026-05-11'
modified: '2026-05-11'
specificationVersion: '0.19'
apis:
  - aid: employment-hero:rest-api
    name: Employment Hero REST API
    description: >-
      Versioned REST API (v1) for accessing Employment Hero HR, payroll, and
      employee data including organisations, employees, teams, leave, pay
      runs, and onboarding. Apps register through the Developer Portal to
      obtain OAuth 2.0 client credentials; access tokens are sent via the
      Authorization header and expire after 15 minutes, refreshed via refresh
      tokens.
    humanURL: https://developer.employmenthero.com/api-references
    baseURL: https://api.employmenthero.com/api/v1
    tags:
      - HR
      - HRIS
      - Payroll
      - Employees
    properties:
      - type: Documentation
        url: https://developer.employmenthero.com/api-references
      - type: DeveloperPortal
        url: https://developer.employmenthero.com
      - type: GettingStarted
        url: https://help.employmenthero.com/hc/en-au/articles/15142240450703-Accessing-the-Employment-Hero-API-and-Developer-Portal
  - aid: employment-hero:payroll-api
    name: Employment Hero Payroll API (KeyPay)
    description: >-
      Employment Hero Payroll (formerly KeyPay) REST API for managing
      businesses, employees, pay runs, leave, timesheets, super, tax, and
      reporting across the AU, UK, NZ, and SG payroll regions.
    humanURL: https://api.keypay.com.au/australia/guides/Home
    baseURL: https://api.keypay.com.au/api/v2
    tags:
      - Payroll
      - HR
      - Employees
    properties:
      - type: Documentation
        url: https://api.keypay.com.au/australia/guides/Home

