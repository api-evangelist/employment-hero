  /api/v2/business/{businessId}/employee/activate/{employeeId}:
    post:
      tags:
      - Employee
      summary: Activate Employee
      description: Activates the employee with the specified ID.
      operationId: EmployeeActivate_PostActivate
      parameters:
      - in: path
        name: employeeId
        required: true
        title: Int32
        schema:
          type: integer
          format: int32
      - in: path
        name: businessId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
  /api/v2/business/{businessId}/employee/details:
    get:
      tags:
      - Employee
      summary: List basic details for employees
      description: 'This endpoint returns a list of employees. The details are a subset of the ''unstructured'' employee endpoint.

        This data can be filtered much more efficiently though so if you only need the basic employee details, this endpoint is preferred.


        This operation supports OData queries (only $filter, $orderby, $top, $skip).'
      operationId: EmployeeDetails_GetEmployees
      parameters:
      - in: query
        name: query
      - in: path
        name: businessId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: IList<EmployeeDetailsModel>
                type: array
                items:
                  $ref: '#/components/schemas/EmployeeDetailsModel'
            application/xml:
              schema:
