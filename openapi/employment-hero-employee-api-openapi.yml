  /api/v2/business/{businessId}/employee/unstructured:
    post:
      tags:
      - Employee
      summary: Create or Update Employee
      description: 'If an ID is passed or an existing employee is matched (according to the matchType parameter), it will

        be updated. Otherwise a new employee will be created.


        MatchType parameter values:


        Standard (default): attempts to match an existing employee - first, based on the tax file number,

        then based on first name + surname + date of birth + email address


        None: do not attempt to match an existing employee (create a new one)


        An employee may be created with a status of ''Incomplete'' by specifying at least the minimum fields; firstName, surname, startDate, employmentType and taxFileNumber.


        For an employee record to be considered ''Complete'' the following groups of data are required:


        Basic Details (Name, Start Date, Date of Birth and Address Details)


        Tax File Declaration (TFN and Employment Type)


        Pay Run Defaults (Default Pay Category, Pay Cycle and Location)


        Locations (at least one)


        Bank Account/s (at least one)


        Super Fund/s (at least one)


        If reporting dimensions are enabled for the business, add primary reporting dimension values using "|" as a separator between values.'
      operationId: AuEmployee_PostEmployee
      parameters:
      - in: query
        name: matchType
        title: EmployeeMatchType
        schema:
          type: string
          enum:
          - None
          - Standard
          default: Standard
      - in: path
        name: businessId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeUpdateResponseModel'
            application/xml:
              schema:
                $ref: '#/components/schemas/EmployeeUpdateResponseModel'
            text/plain:
              schema:
                $ref: '#/components/schemas/EmployeeUpdateResponseModel'
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/EmployeeUpdateResponseModel'
            text/json:
              schema:
                $ref: '#/components/schemas/EmployeeUpdateResponseModel'
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeUpdateResponseModel'
            application/xml:
              schema:
                $ref: '#/components/schemas/EmployeeUpdateResponseModel'
            text/plain:
              schema:
                $ref: '#/components/schemas/EmployeeUpdateResponseModel'
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/EmployeeUpdateResponseModel'
            text/json:
              schema:
                $ref: '#/components/schemas/EmployeeUpdateResponseModel'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/xml:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuUnstructuredEmployeeModel'
    get:
      tags:
      - Employee
      summary: List Employees
      description: 'This endpoint returns the unstructured employee details for all matching employees.


        See also: List basic details for employees (which is much more efficient if that is all the information that is required)


        Pagination: This endpoint enforces a maximum of 100 records per request.


        If `$top` is not specified, it defaults to 100.


        If `$top` exceeds 100, the API returns a 400 Bad Request error.


        To retrieve more than 100 employees, paginate using OData query parameters:


        `$skip` — number of records to skip


        `$top` — number of records to return (max 100)


        Example: Page 1: `?$skip=0&$top=100`, Page 2: `?$skip=100&$top=100`, etc.


        This operation supports OData queries (only $filter, $orderby, $top, $skip).'
      operationId: AuEmployee_GetEmployees
      parameters:
      - in: query
        name: PayScheduleId
        title: Nullable<Int32>
        schema:
          type: integer
          format: int32
      - in: query
        name: LocationId
        title: Nullable<Int32>
        schema:
          type: integer
          format: int32
      - in: query
        name: options
      - in: path
        name: businessId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: List<AuUnstructuredEmployeeModel>
                type: array
                items:
                  $ref: '#/components/schemas/AuUnstructuredEmployeeModel'
            application/xml:
              schema:
