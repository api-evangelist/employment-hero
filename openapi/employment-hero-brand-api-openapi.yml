  /api/v2/brand/{brandId}/business/{businessId}/cancel:
    delete:
      tags:
      - Brand
      summary: Cancel Business
      description: 'Delete all pay runs and employees. Disassociates users who have access to other businesses or brands. Deactivates users only associated with this business.

        This endpoint is for brand users only.'
      operationId: CancelBusiness_Cancel
      parameters:
      - in: path
        name: businessId
        required: true
        title: Int32
        schema:
          type: integer
          format: int32
      - in: path
        name: brandId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
