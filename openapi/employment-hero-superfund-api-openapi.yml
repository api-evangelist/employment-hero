  /api/v2/business/{businessId}/superfund/productsearch:
    get:
      tags:
      - SuperFund
      summary: Search Super Funds
      description: Search for super funds based on a string, search by defaults to All
      operationId: AuSuperFund_ProductSearch
      parameters:
      - in: query
        name: term
        title: String
        schema:
          type: string
      - in: query
        name: searchBy
        title: SuperFundSearchBy
        schema:
          type: string
          enum:
          - All
          - Usi
          - Abn
          - Name
          default: All
      - in: path
        name: businessId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: List<SuperProductEditModel>
                type: array
                items:
                  $ref: '#/components/schemas/SuperProductEditModel'
                x-title: List<SuperProductEditModel>
            application/xml:
