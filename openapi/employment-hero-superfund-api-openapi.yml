  /api/v2/business/{businessId}/selfmanagedsuperfund/{id}:
    get:
      tags:
      - SuperFund
      summary: Get Self Managed Super Fund by ID
      description: Gets the self managed super fund with the specified ID.
      operationId: AuSelfManagedSuperFund_Get_2
      parameters:
      - in: path
        name: id
        required: true
        title: Int32
        schema:
          type: integer
          format: int32
      - in: path
        name: businessId
        required: true
        schema:
          type: string
