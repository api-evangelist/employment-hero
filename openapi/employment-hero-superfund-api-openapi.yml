paths:
  /api/v2/business/{businessId}/selfmanagedsuperfund:
    get:
      tags:
      - SuperFund
      summary: List Self Managed Super Funds
      description: 'Lists all the self managed super funds for the business.


        This operation supports OData queries (only $filter, $orderby, $top, $skip).'
      operationId: AuSelfManagedSuperFund_GetFunds
      parameters:
      - in: query
        name: query
      - in: path
        name: businessId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: IEnumerable<SelfManagedSuperFundModel>
                type: array
                items:
                  $ref: '#/components/schemas/SelfManagedSuperFundModel'
                x-title: IEnumerable<SelfManagedSuperFundModel>
            application/xml:
              schema:
                title: IEnumerable<SelfManagedSuperFundModel>
                type: array
                items:
                  $ref: '#/components/schemas/SelfManagedSuperFundModel'
