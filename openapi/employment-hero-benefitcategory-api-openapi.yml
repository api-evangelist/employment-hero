  description: Benefit Categories
paths:
  /api/v2/business/{businessId}/benefitcategory:
    get:
      tags:
      - BenefitCategory
      summary: List Benefit Categories
      description: Lists the benefit categories
      operationId: UkBenefitCategory_List
      parameters:
      - in: path
        name: businessId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: IList<UkBenefitCategoryReadModel>
                type: array
                items:
                  $ref: '#/components/schemas/UkBenefitCategoryReadModel'
            application/xml:
