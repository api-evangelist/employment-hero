  /api/v2/business/{businessId}/benefitcategory/{id}:
    get:
      tags:
      - BenefitCategory
      summary: Get Benefit Category by ID
      description: Gets the benefit category with the specified ID
      operationId: UkBenefitCategory_Get
      parameters:
      - in: path
        name: id
        required: true
        title: Int32
        schema:
          type: integer
          format: int32
      - in: path
        name: businessId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UkBenefitCategoryReadModel'
            application/xml:
              schema:
                $ref: '#/components/schemas/UkBenefitCategoryReadModel'
            text/plain:
              schema:
                $ref: '#/components/schemas/UkBenefitCategoryReadModel'
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/UkBenefitCategoryReadModel'
            text/json:
              schema:
                $ref: '#/components/schemas/UkBenefitCategoryReadModel'
    delete:
      tags:
      - BenefitCategory
      summary: Delete benefit category
      description: Deletes the benefit category with the specified ID
      operationId: UkBenefitCategory_Delete_2
      parameters:
      - in: path
        name: id
        required: true
        title: Int32
        schema:
          type: integer
          format: int32
      - in: path
        name: businessId
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
  /api/v2/business/{businessId}/import/benefit-categories:
    post:
      tags:
      - BenefitCategory
      summary: Create Import Benefit Categories
      description: 'Example request:

        {

        "isPayrollingBenefit": false,

        "taxYear": 2024,

        "carryBenefitForward": true,

        "benefitCategoryType": 13, // OtherItemsNoNic from BenefitCategoryTypeEnum

        "benefitCategoryName": "Example benefit category",

        "value": 99.50,

        "internalBenefitCategoryEnumId": 2, // Other from BenefitCategoryOtherNoNicSubType

        "description": "Custom benefit description",

        "fuelType": 1, // For car benefits: DieselMeetingEuroStandards from BenefitCategoryCarFuelType

        "engineSize": 2 // For car benefits: Between1401And2000 from BenefitCategoryCarEngineSize

        }'
      operationId: ImportBenefitCategories_Post
      parameters:
      - in: path
        name: businessId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UkBenefitCategoryEditModel'
            application/xml:
              schema:
                $ref: '#/components/schemas/UkBenefitCategoryEditModel'
            text/plain:
              schema:
                $ref: '#/components/schemas/UkBenefitCategoryEditModel'
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/UkBenefitCategoryEditModel'
            text/json:
              schema:
                $ref: '#/components/schemas/UkBenefitCategoryEditModel'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/xml:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportBenefitCategoryModel'
          application/xml:
            schema:
              $ref: '#/components/schemas/ImportBenefitCategoryModel'
          text/plain:
            schema:
              $ref: '#/components/schemas/ImportBenefitCategoryModel'
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/ImportBenefitCategoryModel'
          text/json:
            schema:
              $ref: '#/components/schemas/ImportBenefitCategoryModel'
          application/*+json:
            schema:
              $ref: '#/components/schemas/ImportBenefitCategoryModel'
