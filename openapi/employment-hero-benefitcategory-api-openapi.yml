          text/json:
            schema:
              $ref: '#/components/schemas/SaveBenefitCategoriesProcessingOptionsModel'
          application/*+json:
            schema:
              $ref: '#/components/schemas/SaveBenefitCategoriesProcessingOptionsModel'
  /api/v2/business/{businessId}/benefitcategory/registeredfromtaxyearoptions:
