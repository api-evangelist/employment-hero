            application/json:
              schema:
                $ref: '#/components/schemas/UkBenefitCategoryReadModel'
            application/xml:
              schema:
                $ref: '#/components/schemas/UkBenefitCategoryReadModel'
            text/plain:
              schema:
                $ref: '#/components/schemas/UkBenefitCategoryReadModel'
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/UkBenefitCategoryReadModel'
            text/json:
              schema:
                $ref: '#/components/schemas/UkBenefitCategoryReadModel'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UkBenefitCategoryEditModel'
          application/xml:
            schema:
              $ref: '#/components/schemas/UkBenefitCategoryEditModel'
          text/plain:
            schema:
              $ref: '#/components/schemas/UkBenefitCategoryEditModel'
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/UkBenefitCategoryEditModel'
          text/json:
            schema:
              $ref: '#/components/schemas/UkBenefitCategoryEditModel'
