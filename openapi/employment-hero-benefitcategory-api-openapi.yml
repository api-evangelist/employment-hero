  /api/v2/business/{businessId}/benefitcategory/processingoptions:
    get:
      tags:
      - BenefitCategory
      summary: Get processing options
      description: Gets p11d and/or payrolling of benefits active or inactive and registered from tax year
      operationId: UkBenefitCategory_ProcessingOptions
      parameters:
      - in: path
        name: businessId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UkBenefitCategoriesProcessingOptions'
            application/xml:
              schema:
                $ref: '#/components/schemas/UkBenefitCategoriesProcessingOptions'
            text/plain:
              schema:
                $ref: '#/components/schemas/UkBenefitCategoriesProcessingOptions'
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/UkBenefitCategoriesProcessingOptions'
            text/json:
              schema:
                $ref: '#/components/schemas/UkBenefitCategoriesProcessingOptions'
    put:
      tags:
      - BenefitCategory
      summary: Set processing options
      description: Sets p11d and/or payrolling of benefits active or inactive and the business as having registered with HMRC from the given tax year
      operationId: UkBenefitCategory_ProcessingOptions_2
      parameters:
      - in: path
        name: businessId
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
