                items:
                  $ref: '#/components/schemas/UkBenefitCategoryReadModel'
            text/plain:
              schema:
                title: IList<UkBenefitCategoryReadModel>
                type: array
                items:
                  $ref: '#/components/schemas/UkBenefitCategoryReadModel'
            application/octet-stream:
              schema:
                title: IList<UkBenefitCategoryReadModel>
                type: array
                items:
                  $ref: '#/components/schemas/UkBenefitCategoryReadModel'
            text/json:
              schema:
                title: IList<UkBenefitCategoryReadModel>
                type: array
                items:
                  $ref: '#/components/schemas/UkBenefitCategoryReadModel'
    post:
      tags:
      - BenefitCategory
      summary: Create benefit category
      description: Creates a new benefit category
      operationId: UkBenefitCategory_Create
      parameters:
      - in: path
        name: businessId
        required: true
        schema:
          type: string
      responses:
