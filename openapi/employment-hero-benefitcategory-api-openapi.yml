      - in: path
        name: businessId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UkUpdateBenefitCategoryResult'
            application/xml:
              schema:
                $ref: '#/components/schemas/UkUpdateBenefitCategoryResult'
            text/plain:
              schema:
                $ref: '#/components/schemas/UkUpdateBenefitCategoryResult'
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/UkUpdateBenefitCategoryResult'
            text/json:
              schema:
                $ref: '#/components/schemas/UkUpdateBenefitCategoryResult'
