          text/plain:
            schema:
              title: UkBenefitCategoryEditModel[]
              type: array
              items:
                $ref: '#/components/schemas/UkBenefitCategoryEditModel'
          application/json-patch+json:
            schema:
              title: UkBenefitCategoryEditModel[]
              type: array
              items:
