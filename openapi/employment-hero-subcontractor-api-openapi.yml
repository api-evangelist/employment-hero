paths:
  /api/v2/business/{businessId}/subcontractor:
    post:
      tags:
      - Subcontractor
      summary: Create subcontractor
      description: Creates a new subcontractor
      operationId: UkSubcontractor_Create
      parameters:
      - in: path
        name: businessId
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UkSubcontractorReadModel'
            application/xml:
              schema:
                $ref: '#/components/schemas/UkSubcontractorReadModel'
            text/plain:
              schema:
                $ref: '#/components/schemas/UkSubcontractorReadModel'
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/UkSubcontractorReadModel'
            text/json:
              schema:
                $ref: '#/components/schemas/UkSubcontractorReadModel'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UkSubcontractorCreateModel'
          application/xml:
            schema:
              $ref: '#/components/schemas/UkSubcontractorCreateModel'
          text/plain:
            schema:
              $ref: '#/components/schemas/UkSubcontractorCreateModel'
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/UkSubcontractorCreateModel'
          text/json:
            schema:
              $ref: '#/components/schemas/UkSubcontractorCreateModel'
          application/*+json:
            schema:
              $ref: '#/components/schemas/UkSubcontractorCreateModel'
  /api/v2/business/{businessId}/subcontractor/{subcontractorId}/paymentdetails:
    post:
      tags:
      - Subcontractor
      summary: Save subcontractor payment details
      description: Creates or updates payment details for a subcontractor
      operationId: UkSubcontractor_SavePaymentDetails
      parameters:
      - in: path
        name: subcontractorId
        required: true
        title: Int32
        schema:
          type: integer
          format: int32
      - in: path
        name: businessId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UkSubcontractorPaymentDetailsModel'
            application/xml:
              schema:
                $ref: '#/components/schemas/UkSubcontractorPaymentDetailsModel'
            text/plain:
              schema:
                $ref: '#/components/schemas/UkSubcontractorPaymentDetailsModel'
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/UkSubcontractorPaymentDetailsModel'
            text/json:
              schema:
                $ref: '#/components/schemas/UkSubcontractorPaymentDetailsModel'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UkSaveSubcontractorPaymentDetailsModel'
          application/xml:
            schema:
              $ref: '#/components/schemas/UkSaveSubcontractorPaymentDetailsModel'
          text/plain:
            schema:
              $ref: '#/components/schemas/UkSaveSubcontractorPaymentDetailsModel'
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/UkSaveSubcontractorPaymentDetailsModel'
          text/json:
            schema:
              $ref: '#/components/schemas/UkSaveSubcontractorPaymentDetailsModel'
          application/*+json:
            schema:
              $ref: '#/components/schemas/UkSaveSubcontractorPaymentDetailsModel'
