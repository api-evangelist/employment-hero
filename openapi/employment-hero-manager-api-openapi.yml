openapi: 3.2.0
info:
  title: Employment Hero Manager API
  version: '1.0'
  description: 'Operations tagged Manager across 5 of this provider''s published API definitions: employment-hero-payroll-au-swagger.json, employment-hero-payroll-my-swagger.json, employment-hero-payroll-nz-swagger.json, employment-hero-payroll-sg-swagger.json, employment-hero-payroll-uk-swagger.json. Each path carries the servers of the definition it was published in.'
security:
- basic: []
- apiKey: []
- oauth2:
  - read
  - write
- basic: []
- apiKey: []
- oauth2:
  - read
  - write
- basic: []
- apiKey: []
- oauth2:
  - read
  - write
- basic: []
- apiKey: []
- oauth2:
  - read
  - write
- basic: []
- apiKey: []
- oauth2:
  - read
  - write
tags:
- name: Manager
  description: Manager
paths:
  /api/v2/business/{businessId}/manager/dashboard:
    get:
      tags:
      - Manager
      summary: Get Dashboard
      description: Gets a set of useful information that the manager may need.
      operationId: Manager_GetDashboard
      parameters:
      - in: path
        name: businessId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagerDashboardModel'
            application/xml:
              schema:
                $ref: '#/components/schemas/ManagerDashboardModel'
            text/plain:
              schema:
                $ref: '#/components/schemas/ManagerDashboardModel'
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/ManagerDashboardModel'
            text/json:
              schema:
                $ref: '#/components/schemas/ManagerDashboardModel'
  /api/v2/business/{businessId}/manager/employee/{employeeId}/image:
    get:
      tags:
      - Manager
      summary: Get Employee Profile Image
      description: Returns the file content for the employee's current profile image.
      operationId: ManagerEmployeeProfileImage_Get
      parameters:
      - in: path
        name: businessId
        required: true
        schema:
          type: string
      - in: path
        name: employeeId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                format: byte
                title: Byte[]
                type: string
                x-title: Byte[]
            application/xml:
              schema:
                format: byte
                title: Byte[]
                type: string
                x-title: Byte[]
            text/plain:
              schema:
                format: byte
                title: Byte[]
                type: string
                x-title: Byte[]
            application/octet-stream:
              schema:
                format: byte
                title: Byte[]
                type: string
                x-title: Byte[]
            text/json:
              schema:
                format: byte
                title: Byte[]
                type: string
                x-title: Byte[]
        '304':
          description: Not Modified
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/xml:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: Service Unavailable
    post:
      tags:
      - Manager
      summary: Set Employee Profile Image
      description: Uploads a new employee profile image. The request should be a MIME multipart file upload request.
      operationId: ManagerEmployeeProfileImage_Post_2
      parameters:
      - in: path
        name: businessId
        required: true
        schema:
          type: string
      - in: path
        name: employeeId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileImageMetadata'
            application/xml:
              schema:
                $ref: '#/components/schemas/ProfileImageMetadata'
            text/plain:
              schema:
                $ref: '#/components/schemas/ProfileImageMetadata'
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/ProfileImageMetadata'
            text/json:
              schema:
                $ref: '#/components/schemas/ProfileImageMetadata'
        '415':
          description: Unsupported Media Type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/xml:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    delete:
      tags:
      - Manager
      summary: Delete Employee Profile Image
      description: Delete's the employee's profile image.
      operationId: ManagerEmployeeProfileImage_Delete_3
      parameters:
      - in: path
        name: businessId
        required: true
        schema:
          type: string
      - in: path
        name: employeeId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/xml:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
