  /api/v2/business/{businessId}/manager/expense:
    get:
      tags:
      - Manager
      summary: Get Business Expense Requests
      description: Retrieves expense request for the specified business which manager can access
      operationId: ManagerExpense_Get
      parameters:
      - in: query
        name: Status
        title: Nullable<EmployeeExpenseRequestStatus>
        schema:
          type: string
          enum:
          - Pending
          - Approved
          - Cancelled
          - Declined
          - Processed
      - in: query
        name: FromDate
        title: Nullable<DateTime>
        schema:
          type: string
          format: date-time
      - in: query
        name: ToDate
        title: Nullable<DateTime>
        schema:
          type: string
          format: date-time
      - in: query
        name: EmployeeId
        title: Nullable<Int32>
        schema:
          type: integer
          format: int32
      - in: query
        name: LocationId
        title: Nullable<Int32>
        schema:
          type: integer
          format: int32
      - in: query
        name: ExpenseCategoryId
        title: Nullable<Int32>
        schema:
          type: integer
          format: int32
      - in: query
        name: GroupBy
        title: Nullable<EmployeeExpenseRequestGroupBy>
        schema:
          type: string
          enum:
          - Employee
          - ExpenseCategory
      - in: query
        name: CurrentPage
        title: Int32
        schema:
          type: integer
          format: int32
      - in: query
        name: PageSize
        title: Nullable<Int32>
        schema:
          type: integer
          format: int32
      - in: path
        name: businessId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagerExpenseRequestModelPagedResultModel'
            application/xml:
              schema:
                $ref: '#/components/schemas/ManagerExpenseRequestModelPagedResultModel'
            text/plain:
              schema:
