                title: IEnumerable<LocationModel>
                type: array
                items:
                  $ref: '#/components/schemas/LocationModel'
                x-title: IEnumerable<LocationModel>
            text/json:
              schema:
                title: IEnumerable<LocationModel>
                type: array
                items:
                  $ref: '#/components/schemas/LocationModel'
                x-title: IEnumerable<LocationModel>
  /api/v2/business/{businessId}/manager/employeeonboarding/initiateselfservice:
    post:
      tags:
      - Manager
      summary: Initiate Employee Self Setup
      description: 'Initiate the Self Setup process for an Employee.

        If the employee has an existing employee record, the id should be specified. If the Email and Mobile provided

        are not the same as those on the employee record, they will be updated.

        If the employee does not yet have an employee record do not specify an id, one will be created with the

        details provided.'
      operationId: AuManagerEmployeeOnboarding_ManagerInitiateSelfService
      parameters:
      - in: path
        name: businessId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/xml:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuInitiateEmployeeOnboardingApiModel'
          application/xml:
            schema:
              $ref: '#/components/schemas/AuInitiateEmployeeOnboardingApiModel'
          text/plain:
            schema:
              $ref: '#/components/schemas/AuInitiateEmployeeOnboardingApiModel'
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/AuInitiateEmployeeOnboardingApiModel'
          text/json:
            schema:
              $ref: '#/components/schemas/AuInitiateEmployeeOnboardingApiModel'
          application/*+json:
            schema:
              $ref: '#/components/schemas/AuInitiateEmployeeOnboardingApiModel'
