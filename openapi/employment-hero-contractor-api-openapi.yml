            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuContractorUnstructuredModel'
          application/xml:
            schema:
              $ref: '#/components/schemas/AuContractorUnstructuredModel'
          text/plain:
            schema:
              $ref: '#/components/schemas/AuContractorUnstructuredModel'
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/AuContractorUnstructuredModel'
          text/json:
            schema:
