paths:
  /api/v2/business/{businessId}/contractor:
    get:
      tags:
      - Contractor
      summary: List contractors
      description: List active contractors for the business.
      operationId: AuContractor_List
      parameters:
      - in: path
        name: businessId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: IEnumerable<ContractorSimpleModel>
                type: array
                items:
                  $ref: '#/components/schemas/ContractorSimpleModel'
            application/xml:
              schema:
                title: IEnumerable<ContractorSimpleModel>
                type: array
                items:
                  $ref: '#/components/schemas/ContractorSimpleModel'
            text/plain:
              schema:
                title: IEnumerable<ContractorSimpleModel>
                type: array
                items:
                  $ref: '#/components/schemas/ContractorSimpleModel'
            application/octet-stream:
              schema:
                title: IEnumerable<ContractorSimpleModel>
                type: array
                items:
                  $ref: '#/components/schemas/ContractorSimpleModel'
            text/json:
              schema:
                title: IEnumerable<ContractorSimpleModel>
                type: array
                items:
                  $ref: '#/components/schemas/ContractorSimpleModel'
    post:
      tags:
      - Contractor
      summary: Create or update contractor
      description: 'If an ID is passed or an existing contractor is matched, it will

        be updated. Otherwise a new record will be created.


        If reporting dimensions are enabled for the business, add primary reporting dimension values using "|" as a separator between values.'
      operationId: AuContractor_Post
      parameters:
      - in: path
        name: businessId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuContractorUnstructuredModel'
            application/xml:
              schema:
                $ref: '#/components/schemas/AuContractorUnstructuredModel'
            text/plain:
              schema:
                $ref: '#/components/schemas/AuContractorUnstructuredModel'
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/AuContractorUnstructuredModel'
            text/json:
              schema:
                $ref: '#/components/schemas/AuContractorUnstructuredModel'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/xml:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/octet-stream:
              schema:
