paths:
  /api/v2/reseller:
    get:
      tags:
      - Reseller
      summary: List Resellers
      description: Lists all the resellers to which you have access.
      operationId: Reseller_GetResellers
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: IEnumerable<ResellerModel>
                type: array
                items:
                  $ref: '#/components/schemas/ResellerModel'
            application/xml:
              schema:
                title: IEnumerable<ResellerModel>
                type: array
                items:
                  $ref: '#/components/schemas/ResellerModel'
            text/plain:
              schema:
                title: IEnumerable<ResellerModel>
                type: array
                items:
                  $ref: '#/components/schemas/ResellerModel'
            application/octet-stream:
              schema:
                title: IEnumerable<ResellerModel>
                type: array
                items:
                  $ref: '#/components/schemas/ResellerModel'
            text/json:
              schema:
                title: IEnumerable<ResellerModel>
                type: array
                items:
                  $ref: '#/components/schemas/ResellerModel'
  /api/v2/reseller/{id}:
    get:
      tags:
      - Reseller
      summary: Get Reseller by ID
      description: Gets the resellers with the specified ID.
      operationId: Reseller_Get
      parameters:
      - in: path
        name: id
        required: true
        title: Int32
        schema:
          type: integer
          format: int32
      responses:
