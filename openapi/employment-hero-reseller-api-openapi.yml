            application/octet-stream:
              schema:
                $ref: '#/components/schemas/ResellerModel'
            text/json:
              schema:
                $ref: '#/components/schemas/ResellerModel'
components:
  schemas:
    ResellerModel:
      title: ResellerModel
      type: object
      properties:
        id:
          format: int32
          title: Int32
          type: integer
          x-title: Int32
        name:
          title: String
          type: string
          x-title: String
      additionalProperties: false
  securitySchemes:
