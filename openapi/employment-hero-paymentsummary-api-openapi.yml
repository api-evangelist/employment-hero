openapi: 3.2.0
info:
  title: Australia Payment Summary API
  version: AU
  description: Payment Summaries
security:
- basic: []
- apiKey: []
- oauth2:
  - read
  - write
- basic: []
- apiKey: []
- oauth2:
  - read
