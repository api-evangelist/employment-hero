tags:
- name: PaymentSummary
  description: Payment Summaries
paths:
  /api/v2/business/{businessId}/paymentsummary/{financialYearEnding}:
    get:
      tags:
      - PaymentSummary
      summary: List Payment Summaries
      description: 'Lists all the payment summaries for the specified financial year.


        This operation supports OData queries (only $filter, $orderby, $top, $skip).'
      operationId: AuPaymentSummary_Get
      parameters:
      - in: path
        name: financialYearEnding
        required: true
        title: Int32
        schema:
          type: integer
          format: int32
          pattern: ^2[0-9]{3}$
      - in: query
        name: query
      - in: path
        name: businessId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: IEnumerable<PaygPaymentSummaryModel>
                type: array
                items:
                  $ref: '#/components/schemas/PaygPaymentSummaryModel'
            application/xml:
              schema:
                title: IEnumerable<PaygPaymentSummaryModel>
                type: array
                items:
                  $ref: '#/components/schemas/PaygPaymentSummaryModel'
            text/plain:
              schema:
                title: IEnumerable<PaygPaymentSummaryModel>
                type: array
                items:
                  $ref: '#/components/schemas/PaygPaymentSummaryModel'
            application/octet-stream:
              schema:
                title: IEnumerable<PaygPaymentSummaryModel>
                type: array
                items:
                  $ref: '#/components/schemas/PaygPaymentSummaryModel'
            text/json:
              schema:
                title: IEnumerable<PaygPaymentSummaryModel>
                type: array
                items:
                  $ref: '#/components/schemas/PaygPaymentSummaryModel'
    put:
      tags:
      - PaymentSummary
      summary: Generate Payment Summaries
      description: Generates (or regenerates) payment summaries for the specified financial year/business. Only unpublished payment summaries will be regenerated.
      operationId: AuPaymentSummary_Put_2
      parameters:
      - in: path
        name: financialYearEnding
        required: true
        title: Int32
        schema:
          type: integer
          format: int32
          pattern: ^2[0-9]{3}$
      - in: query
        name: employeeId
        title: Nullable<Int32>
        schema:
          type: integer
          format: int32
      - in: query
        name: employingEntityId
        title: Nullable<Int32>
        schema:
          type: integer
          format: int32
      - in: query
        name: locationId
        title: Nullable<Int32>
        schema:
          type: integer
          format: int32
      - in: path
        name: businessId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaygPaymentSummaryModel'
            application/xml:
              schema:
                $ref: '#/components/schemas/PaygPaymentSummaryModel'
            text/plain:
              schema:
                $ref: '#/components/schemas/PaygPaymentSummaryModel'
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/PaygPaymentSummaryModel'
            text/json:
              schema:
                $ref: '#/components/schemas/PaygPaymentSummaryModel'
    post:
      tags:
      - PaymentSummary
      summary: Publish Payment Summaries
      description: Publish payment summaries for the specified financial year.
      operationId: AuPaymentSummary_Post_3
      parameters:
      - in: path
        name: financialYearEnding
        required: true
        title: Int32
        schema:
          type: integer
          format: int32
          pattern: ^2[0-9]{3}$
      - in: query
        name: employeeId
        title: Nullable<Int32>
        schema:
          type: integer
          format: int32
      - in: query
        name: employingEntityId
        title: Nullable<Int32>
        schema:
          type: integer
          format: int32
      - in: query
        name: locationId
        title: Nullable<Int32>
        schema:
          type: integer
          format: int32
      - in: path
        name: businessId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
    delete:
      tags:
      - PaymentSummary
      summary: Unpublish Payment Summaries
      description: Unpublish payment summaries for the specified financial year.
      operationId: AuPaymentSummary_Delete_4
      parameters:
      - in: path
        name: financialYearEnding
        required: true
        title: Int32
        schema:
          type: integer
          format: int32
          pattern: ^2[0-9]{3}$
      - in: query
        name: employeeId
        title: Nullable<Int32>
        schema:
          type: integer
          format: int32
      - in: query
        name: employingEntityId
        title: Nullable<Int32>
        schema:
          type: integer
          format: int32
      - in: query
        name: locationId
        title: Nullable<Int32>
        schema:
          type: integer
          format: int32
      - in: path
        name: businessId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
