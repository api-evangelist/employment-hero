tags:
- name: Other
paths:
  /api/v2/business/{businessId}/report/paymentfile:
    get:
      tags:
      - Other
      summary: Get Payment Files by Finalised Pay Run Id
      description: Gets the payment files for a finalised pay run with the specified Id.
      operationId: PaymentFileReport_Get
      parameters:
      - in: query
        name: PayRunId
        title: Int32
        schema:
          type: integer
          format: int32
      - in: query
        name: PaymentFileId
        title: Nullable<Int32>
        schema:
          type: integer
          format: int32
      - in: path
        name: businessId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
  /api/v2/user/create-direct-account:
    post:
      tags:
      - Other
      summary: Create a new direct billing user
      operationId: PublicUser_CreateDirectAccount
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewUserCreatedModel'
            application/xml:
              schema:
                $ref: '#/components/schemas/NewUserCreatedModel'
            text/plain:
              schema:
                $ref: '#/components/schemas/NewUserCreatedModel'
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/NewUserCreatedModel'
            text/json:
              schema:
                $ref: '#/components/schemas/NewUserCreatedModel'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDirectAccountNewUserModel'
          application/xml:
            schema:
              $ref: '#/components/schemas/CreateDirectAccountNewUserModel'
          text/plain:
            schema:
              $ref: '#/components/schemas/CreateDirectAccountNewUserModel'
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/CreateDirectAccountNewUserModel'
          text/json:
            schema:
              $ref: '#/components/schemas/CreateDirectAccountNewUserModel'
          application/*+json:
            schema:
              $ref: '#/components/schemas/CreateDirectAccountNewUserModel'
  /api/v2/bank:
    get:
      tags:
      - Other
      summary: List banks
      operationId: MyBank_List
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: IEnumerable<MyBankModel>
                type: array
                items:
