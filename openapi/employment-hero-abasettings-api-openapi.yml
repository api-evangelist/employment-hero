    get:
      tags:
      - AbaSettings
      summary: Get ABA Settings Record by ID
      description: Gets the details for the ABA settings record with the specified ID.
      operationId: AuAba_Get_2
      parameters:
      - in: path
        name: id
        required: true
        title: Int32
        schema:
          type: integer
          format: int32
      - in: path
        name: businessId
        required: true
        schema:
