components:
  schemas:
    BusinessAbaModel:
      title: BusinessAbaModel
      type: object
      properties:
        id:
          format: int32
          title: Int32
          type: integer
          x-title: Int32
        bsb:
          title: String
          type: string
          x-title: String
        accountNumber:
          title: String
          type: string
          x-title: String
        accountName:
          title: String
          type: string
          x-title: String
        financialInstitutionCode:
          title: String
          type: string
          x-title: String
        lodgementReference:
          title: String
          type: string
          x-title: String
        userName:
          title: String
          type: string
          x-title: String
        userId:
          title: String
          type: string
          x-title: String
        includeSelfBalancingTransaction:
          title: Boolean
          type: boolean
          x-title: Boolean
        mergeMultipleAccountPayments:
          title: Boolean
          type: boolean
          x-title: Boolean
        balanceLodgementReference:
          title: String
          type: string
          x-title: String
        paymentAdditionalContent:
          title: Nullable<PaymentFilePaymentAdditionalContent>
          enum:
          - None
          - PeriodEndingDate
          - PaymentDate
          - EmployeeId
          - PayRunId
          type: string
        balanceAdditionalContent:
          title: Nullable<PaymentFileBalanceAdditionalContent>
          enum:
          - None
          - PeriodEndingDate
          - PaymentDate
          - PayRunId
          type: string
      additionalProperties: false
  securitySchemes:
    basic:
      type: http
      scheme: basic
      description: Your API key should be the username and the password can be left blank
    apiKey:
      type: apiKey
      in: header
      description: API Key Authentication
    oauth2:
      type: oauth2
      flows:
        implicit:
          scopes:
            read: Read access to protected resources
            write: Write access to protected resources
          authorizationUrl: https://keypay.yourpayroll.com.au/oauth/authorise
      description: OAuth2 Implicit Grant
x-navigateMethodsByName: true
