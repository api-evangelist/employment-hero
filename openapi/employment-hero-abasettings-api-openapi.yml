                type: array
                items:
                  $ref: '#/components/schemas/BusinessAbaModel'
    post:
      tags:
      - AbaSettings
      summary: Create ABA Settings Record
      description: Creates a new ABA settings record for the business.
      operationId: AuAba_Post
