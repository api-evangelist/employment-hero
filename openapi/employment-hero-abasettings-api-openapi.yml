      tags:
      - AbaSettings
      summary: List ABA Settings
      description: 'Retrieves all the ABA settings associated with the business.


        This operation supports OData queries (only $filter, $orderby, $top, $skip).'
      operationId: AuAba_GetAbaDetails
      parameters:
      - in: query
        name: query
      - in: path
        name: businessId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: IEnumerable<BusinessAbaModel>
                type: array
                items:
                  $ref: '#/components/schemas/BusinessAbaModel'
            application/xml:
              schema:
                title: IEnumerable<BusinessAbaModel>
                type: array
                items:
                  $ref: '#/components/schemas/BusinessAbaModel'
