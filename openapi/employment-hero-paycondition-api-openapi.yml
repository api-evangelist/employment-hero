        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: IEnumerable<AuPayConditionRuleSetApiModel>
                type: array
                items:
                  $ref: '#/components/schemas/AuPayConditionRuleSetApiModel'
            application/xml:
