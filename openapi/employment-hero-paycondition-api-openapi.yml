    post:
      tags:
      - PayCondition
      summary: Clone Pay Condition Rule Set
      description: 'Clones an existing pay condition rule set. The cloned rule set will have the same rules and settings as the original,

        but will not be associated with any award package. If no name is provided, the name will be ''{original name} - Copy''.'
