paths:
  /api/v2/business/{businessId}/paycategory:
    post:
      tags:
      - PayCategory
      summary: Create Pay Category
      description: Creates a new pay category for the business.
      operationId: AuPayCategory_Post
      parameters:
      - in: path
        name: businessId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
