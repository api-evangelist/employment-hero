          text/json:
            schema:
              $ref: '#/components/schemas/AuPayCategoryModel'
          application/*+json:
            schema:
              $ref: '#/components/schemas/AuPayCategoryModel'
    get:
      tags:
      - PayCategory
      summary: List Pay Categories
      description: 'Lists all the pay categories for the business


        This operation supports OData queries (only $filter, $orderby, $top, $skip).'
      operationId: AuPayCategory_GetPayCategories
      parameters:
      - in: query
        name: query
      - in: path
        name: businessId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: IEnumerable<AuPayCategoryModel>
                type: array
                items:
                  $ref: '#/components/schemas/AuPayCategoryModel'
            application/xml:
              schema:
                title: IEnumerable<AuPayCategoryModel>
                type: array
                items:
                  $ref: '#/components/schemas/AuPayCategoryModel'
            text/plain:
              schema:
                title: IEnumerable<AuPayCategoryModel>
                type: array
                items:
                  $ref: '#/components/schemas/AuPayCategoryModel'
            application/octet-stream:
              schema:
                title: IEnumerable<AuPayCategoryModel>
                type: array
                items:
                  $ref: '#/components/schemas/AuPayCategoryModel'
            text/json:
              schema:
                title: IEnumerable<AuPayCategoryModel>
                type: array
                items:
                  $ref: '#/components/schemas/AuPayCategoryModel'
  /api/v2/business/{businessId}/paycategory/{id}:
    get:
      tags:
      - PayCategory
      summary: Get Pay Category by ID
      description: Gets the pay category with the specified ID.
      operationId: AuPayCategory_Get_2
      parameters:
      - in: path
        name: id
        required: true
        title: Int32
        schema:
          type: integer
          format: int32
      - in: path
        name: businessId
        required: true
        schema:
          type: string
