- name: PaySchedule
  description: Pay Schedules
paths:
  /api/v2/business/{businessId}/payschedule:
    get:
      tags:
      - PaySchedule
      summary: List Pay Schedules
      description: 'Lists all the pay schedules for the business.


        This operation supports OData queries (only $filter, $orderby, $top, $skip).'
      operationId: AuPaySchedule_GetPaySchedules
      parameters:
      - in: query
        name: query
      - in: path
        name: businessId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: IEnumerable<AuPayScheduleModel>
                type: array
                items:
                  $ref: '#/components/schemas/AuPayScheduleModel'
            application/xml:
              schema:
                title: IEnumerable<AuPayScheduleModel>
                type: array
                items:
                  $ref: '#/components/schemas/AuPayScheduleModel'
            text/plain:
              schema:
                title: IEnumerable<AuPayScheduleModel>
                type: array
                items:
                  $ref: '#/components/schemas/AuPayScheduleModel'
            application/octet-stream:
              schema:
                title: IEnumerable<AuPayScheduleModel>
                type: array
                items:
                  $ref: '#/components/schemas/AuPayScheduleModel'
            text/json:
              schema:
                title: IEnumerable<AuPayScheduleModel>
                type: array
                items:
                  $ref: '#/components/schemas/AuPayScheduleModel'
    post:
      tags:
      - PaySchedule
      summary: Create Pay Schedule
      description: Creates a new pay schedule for the business.
      operationId: AuPaySchedule_Post
      parameters:
      - in: path
        name: businessId
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuPayScheduleModel'
            application/xml:
              schema:
                $ref: '#/components/schemas/AuPayScheduleModel'
            text/plain:
              schema:
                $ref: '#/components/schemas/AuPayScheduleModel'
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/AuPayScheduleModel'
            text/json:
              schema:
                $ref: '#/components/schemas/AuPayScheduleModel'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuPayScheduleModel'
          application/xml:
            schema:
              $ref: '#/components/schemas/AuPayScheduleModel'
          text/plain:
            schema:
              $ref: '#/components/schemas/AuPayScheduleModel'
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/AuPayScheduleModel'
          text/json:
            schema:
              $ref: '#/components/schemas/AuPayScheduleModel'
          application/*+json:
            schema:
