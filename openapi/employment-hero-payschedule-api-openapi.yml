  /api/v2/business/{businessId}/import/pay-schedule:
    post:
      tags:
      - PaySchedule
      summary: Import a new pay schedule
      description: 'Creates a new pay schedule for the business by importing from external data.

        The pay schedule defines how frequently employees are paid and related configuration.


        Example request body:

        {

        "name": "Weekly Pay Schedule",

        "frequency": "Weekly",

        "includedEmployees": "All",

        "monthlyPaymentMode": false,

        "proRataCalculations": true,

        "unitType": "Days per year",

        "unit": 260,

        "qualifyingDays": "Working days",

        "locations": [1, 2, 3],

        "paySlipMessage": "Custom message for pay slips"

        }'
      operationId: ImportPaySchedule_Post
      parameters:
      - in: path
        name: businessId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/xml:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayScheduleImportModel'
          application/xml:
            schema:
              $ref: '#/components/schemas/PayScheduleImportModel'
          text/plain:
            schema:
              $ref: '#/components/schemas/PayScheduleImportModel'
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/PayScheduleImportModel'
          text/json:
            schema:
              $ref: '#/components/schemas/PayScheduleImportModel'
          application/*+json:
            schema:
              $ref: '#/components/schemas/PayScheduleImportModel'
        description: The pay schedule import configuration containing all required and optional settings for the new pay schedule
