  /api/v2/business/{businessId}/rostershift/{employeeId}/matchingclockoff:
    get:
      tags:
      - RosterShift
      summary: Find Matching Clock Off Roster Shift
      description: 'If a roster shift exists that could match for this employee to clock off at this time

        given kiosk settings for shift matching, returns that shift.

        Otherwise, the Shift result will be null.

        Note that if the time matches a shift exactly, the Shift result will also be null.'
      operationId: AuRosterShift_MatchingClockOffRosterShift
      parameters:
      - in: path
        name: employeeId
        required: true
        title: Int32
        schema:
          type: integer
          format: int32
      - in: query
        name: kioskId
        title: Int32
        schema:
          type: integer
          format: int32
      - in: query
        name: dateUtc
        title: DateTime
        schema:
          type: string
          format: date-time
      - in: path
        name: businessId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuRosterShiftMatchingResultModel'
            application/xml:
              schema:
                $ref: '#/components/schemas/AuRosterShiftMatchingResultModel'
            text/plain:
