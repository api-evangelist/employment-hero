tags:
- name: RosterShift
  description: Roster Shifts
paths:
  /api/v2/business/{businessId}/rostershift:
    get:
      tags:
      - RosterShift
      summary: Get Roster Shifts
      description: 'Gets roster shifts, optionally filtered by a number of parameters. Query parameters ''fromDate'' and ''toDate'' are required.

        NOTE: By default, only shifts with no role assigned are returned. To return shifts with roles, either specify some SelectedRoles,

        or specify SelectAllRoles = true.'
      operationId: AuRosterShift_Get
      parameters:
      - in: query
        name: FromDate
        title: DateTime
        schema:
          type: string
          format: date-time
      - in: query
        name: ToDate
        title: DateTime
        schema:
          type: string
          format: date-time
      - in: query
        name: ShiftStatus
        title: RosterShiftStatus
        schema:
          type: string
          enum:
          - All
          - Published
          - Unpublished
          - Accepted
      - in: query
        name: ShiftStatuses
        title: IList<RosterShiftStatus>
        style: form
        explode: true
        schema:
          type: array
          items:
            title: RosterShiftStatus
            enum:
            - All
            - Published
            - Unpublished
            - Accepted
            type: string
            x-title: RosterShiftStatus
      - in: query
        name: SelectedLocations
        title: IList<String>
        style: form
        explode: true
        schema:
          type: array
          items:
            title: String
            type: string
            x-title: String
      - in: query
        name: SelectedEmployees
        title: IList<String>
        style: form
        explode: true
        schema:
          type: array
          items:
            title: String
            type: string
            x-title: String
      - in: query
        name: SelectedRoles
        title: IList<String>
        style: form
        explode: true
        schema:
          type: array
          items:
            title: String
            type: string
            x-title: String
      - in: query
        name: EmployeeId
        title: Nullable<Int32>
        schema:
          type: integer
          format: int32
      - in: query
        name: LocationId
        title: Nullable<Int32>
        schema:
          type: integer
          format: int32
      - in: query
        name: EmployeeGroupId
        title: Nullable<Int32>
        schema:
          type: integer
          format: int32
      - in: query
        name: UnassignedShiftsOnly
        title: Boolean
        schema:
          type: boolean
      - in: query
        name: SelectAllRoles
        title: Boolean
        schema:
          type: boolean
      - in: query
        name: ExcludeShiftsOverlappingFromDate
        title: Boolean
        schema:
          type: boolean
      - in: query
        name: PageSize
        title: Nullable<Int32>
        schema:
          type: integer
          format: int32
      - in: query
        name: CurrentPage
        title: Nullable<Int32>
        schema:
          type: integer
          format: int32
      - in: query
        name: IncludeWarnings
        title: Boolean
        schema:
          type: boolean
      - in: path
        name: businessId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: List<AuRosterShiftGenerateTimesheetModel>
                type: array
                items:
                  $ref: '#/components/schemas/AuRosterShiftGenerateTimesheetModel'
                x-title: List<AuRosterShiftGenerateTimesheetModel>
            application/xml:
              schema:
                title: List<AuRosterShiftGenerateTimesheetModel>
                type: array
                items:
                  $ref: '#/components/schemas/AuRosterShiftGenerateTimesheetModel'
                x-title: List<AuRosterShiftGenerateTimesheetModel>
            text/plain:
              schema:
                title: List<AuRosterShiftGenerateTimesheetModel>
                type: array
                items:
                  $ref: '#/components/schemas/AuRosterShiftGenerateTimesheetModel'
                x-title: List<AuRosterShiftGenerateTimesheetModel>
            application/octet-stream:
              schema:
                title: List<AuRosterShiftGenerateTimesheetModel>
                type: array
                items:
                  $ref: '#/components/schemas/AuRosterShiftGenerateTimesheetModel'
                x-title: List<AuRosterShiftGenerateTimesheetModel>
            text/json:
              schema:
                title: List<AuRosterShiftGenerateTimesheetModel>
                type: array
                items:
                  $ref: '#/components/schemas/AuRosterShiftGenerateTimesheetModel'
                x-title: List<AuRosterShiftGenerateTimesheetModel>
