tags:
- name: Timesheets
  description: Timesheets
paths:
  /api/v2/business/{businessId}/timesheet:
    get:
      tags:
      - Timesheets
      summary: Get Business Timesheets
      description: 'Retrieves all timesheets for the specified business.


        This operation supports OData queries (only $filter, $orderby, $top, $skip).'
      operationId: AuTimesheet_Get
      parameters:
      - in: query
        name: query
      - in: path
        name: businessId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: IEnumerable<AuTimesheetLineModel>
                type: array
                items:
                  $ref: '#/components/schemas/AuTimesheetLineModel'
            application/xml:
              schema:
                title: IEnumerable<AuTimesheetLineModel>
                type: array
                items:
                  $ref: '#/components/schemas/AuTimesheetLineModel'
            text/plain:
              schema:
                title: IEnumerable<AuTimesheetLineModel>
                type: array
                items:
                  $ref: '#/components/schemas/AuTimesheetLineModel'
            application/octet-stream:
              schema:
                title: IEnumerable<AuTimesheetLineModel>
                type: array
                items:
                  $ref: '#/components/schemas/AuTimesheetLineModel'
            text/json:
              schema:
                title: IEnumerable<AuTimesheetLineModel>
                type: array
                items:
                  $ref: '#/components/schemas/AuTimesheetLineModel'
    post:
      tags:
      - Timesheets
      summary: Create timesheet line
      description: 'Create an individual timesheet line

        IMPORTANT NOTICE: If units are specified the start and end time will be changed to midnight'
      operationId: AuTimesheet_PostIndividual
      parameters:
      - in: query
        name: enforceUniqueExternalId
        title: Boolean
        schema:
          type: boolean
          default: false
      - in: path
        name: businessId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuIndividualTimesheetLineModel'
            application/xml:
              schema:
                $ref: '#/components/schemas/AuIndividualTimesheetLineModel'
            text/plain:
              schema:
                $ref: '#/components/schemas/AuIndividualTimesheetLineModel'
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/AuIndividualTimesheetLineModel'
            text/json:
              schema:
                $ref: '#/components/schemas/AuIndividualTimesheetLineModel'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/xml:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuIndividualTimesheetLineModel'
          application/xml:
            schema:
              $ref: '#/components/schemas/AuIndividualTimesheetLineModel'
          text/plain:
            schema:
              $ref: '#/components/schemas/AuIndividualTimesheetLineModel'
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/AuIndividualTimesheetLineModel'
          text/json:
            schema:
              $ref: '#/components/schemas/AuIndividualTimesheetLineModel'
          application/*+json:
            schema:
              $ref: '#/components/schemas/AuIndividualTimesheetLineModel'
  /api/v2/business/{businessId}/timesheet/bulk:
    post:
      tags:
      - Timesheets
      summary: Bulk Insert Timesheets
      description: 'Adds timesheets for the specified business. This will not replace any existing timesheets.

        The timesheets should be grouped by their associated employee IDs, with the key for the timesheet array

        being the employee ID. For a Standard Employee ID Type, make sure the employee ID is an integer.

        IMPORTANT NOTICE: If units are specified the start and end time will be changed to midnight'
      operationId: AuTimesheet_Post_2
      parameters:
      - in: path
        name: businessId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuSubmitTimesheetsResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/AuSubmitTimesheetsResponse'
            text/plain:
              schema:
                $ref: '#/components/schemas/AuSubmitTimesheetsResponse'
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/AuSubmitTimesheetsResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/AuSubmitTimesheetsResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/xml:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuSubmitTimesheetsRequest'
          application/xml:
            schema:
              $ref: '#/components/schemas/AuSubmitTimesheetsRequest'
          text/plain:
            schema:
              $ref: '#/components/schemas/AuSubmitTimesheetsRequest'
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/AuSubmitTimesheetsRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/AuSubmitTimesheetsRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/AuSubmitTimesheetsRequest'
    put:
      tags:
      - Timesheets
      summary: Update/Replace timesheets
      description: 'Performs the same action as ''Bulk Insert Timesheets'', but any existing timesheets

        for the specified employees within the specified time period

        (StartTime - EndTime) will be replaced with the timesheets specified.'
      operationId: AuTimesheet_Put_3
      parameters:
      - in: path
        name: businessId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
