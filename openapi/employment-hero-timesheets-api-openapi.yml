            application/xml:
              schema:
                $ref: '#/components/schemas/AuSubmitTimesheetsResponse'
            text/plain:
              schema:
                $ref: '#/components/schemas/AuSubmitTimesheetsResponse'
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/AuSubmitTimesheetsResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/AuSubmitTimesheetsResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/xml:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuSubmitTimesheetsRequest'
          application/xml:
            schema:
              $ref: '#/components/schemas/AuSubmitTimesheetsRequest'
          text/plain:
