                type: array
                items:
                  $ref: '#/components/schemas/UkPayeSchemeResponseModel'
            application/octet-stream:
              schema:
                title: IList<UkPayeSchemeResponseModel>
                type: array
                items:
                  $ref: '#/components/schemas/UkPayeSchemeResponseModel'
            text/json:
              schema:
                title: IList<UkPayeSchemeResponseModel>
                type: array
                items:
                  $ref: '#/components/schemas/UkPayeSchemeResponseModel'
components:
  schemas:
    UkPayeSchemeResponseModel:
      title: UkPayeSchemeResponseModel
      type: object
