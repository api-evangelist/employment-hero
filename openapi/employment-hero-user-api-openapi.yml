          type: string
          x-title: String
        displayName:
          title: String
          minLength: 1
          type: string
          x-title: String
        timeZone:
          title: String
          type: string
          x-title: String
        apiOnly:
          title: Boolean
          type: boolean
          x-title: Boolean
        email:
          title: String
          type: string
          x-title: String
        emailConfirmed:
          title: Boolean
          type: boolean
          x-title: Boolean
      additionalProperties: false
    UserModel:
      title: UserModel
      type: object
      properties:
        id:
          format: int32
          title: Int32
